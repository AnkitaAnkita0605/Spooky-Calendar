<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spooky October Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Rubik+Wet+Paint&display=swap">
<style>
/* Layout: the artist's looping animation is the stage; transparent day buttons sit exactly on her hand-drawn grid; a parchment card floats over it to book. Single dark look, like the video's black frame. */
:root{
  --void:#0b0806;          /* letterbox black, slightly warm */
  --parch:#efe3a6;         /* calendar paper */
  --parch-deep:#e2d08a;
  --ink:#16110d;           /* marker black */
  --blood:#d3241c;         /* the red circle around 31 */
  --ember:#f2652a;         /* background orange */
  --muted:#6d5a3a;
  --f-hand:"Gochi Hand","Patrick Hand","Comic Sans MS",cursive;
  --f-drip:"Rubik Wet Paint","Gochi Hand",Impact,cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--parch);font-family:var(--f-hand);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow-x:hidden}
.rig{position:relative;aspect-ratio:1434/1280;width:min(100%, calc((100dvh - 64px) * 1434 / 1280));max-width:100%}
/* Hand is drawn twice from the same cleaned cut-out. The back copy sits behind the calendar so its thumb and lower pinky tuck
   under the board's top edge; the front copy lives inside .stage (which clips at that edge) and is cut to the
   three gripping fingers (hand-front.png), so they wrap over the front of the board. Both share size, origin and animation so they never drift apart. */
.hand{position:absolute;left:37.52%;top:4.110%;width:23.57%;z-index:0;pointer-events:none;user-select:none;transform-origin:50% 60%;animation:grip 4.5s ease-in-out infinite}
.stage .hand-front{top:-13.648%}
@keyframes grip{0%,100%{transform:none}50%{transform:translateY(.4%) rotate(-.8deg)}}
.stage{position:absolute;left:0;right:0;bottom:0;height:84.375%;z-index:1;container-type:size;
  overflow:hidden;user-select:none;-webkit-user-select:none;background:var(--ember)}
.stage video,.stage img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ---------- day cells ---------- */
.cell{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit;
  border-radius:3px;transition:background .25s, box-shadow .25s}
.cell::after{content:"";position:absolute;inset:6%;border-radius:40%;opacity:0;transition:opacity .25s;
  background:radial-gradient(closest-side,rgba(242,101,42,.55),rgba(242,101,42,0));mix-blend-mode:multiply}
.cell:hover::after,.cell:focus-visible::after,.cell.open::after{opacity:1}
.cell:not(.full):hover{z-index:2;animation:halo 1.3s linear infinite}
.cell:not(.full):hover::after{inset:-4%;transition:none;
  background:radial-gradient(closest-side,rgba(255,150,30,.95),rgba(232,82,20,.8) 45%,rgba(190,40,10,.35) 75%,rgba(190,40,10,0));
  mix-blend-mode:multiply;animation:flicker 1.3s linear infinite, sway 2.2s ease-in-out infinite}
@keyframes flicker{0%{opacity:1;filter:brightness(1)}7%{opacity:.55;filter:brightness(.85)}11%{opacity:.95;filter:brightness(1.15)}19%{opacity:.7}26%{opacity:1;filter:brightness(1.2)}34%{opacity:.45;filter:brightness(.8)}38%{opacity:.9}49%{opacity:.65;filter:brightness(.95)}57%{opacity:1;filter:brightness(1.25)}66%{opacity:.5;filter:brightness(.85)}71%{opacity:.85}82%{opacity:.6}90%{opacity:1;filter:brightness(1.15)}100%{opacity:1;filter:brightness(1)}}
@keyframes halo{0%,100%{box-shadow:0 0 18px 6px rgba(255,140,30,.55)}9%{box-shadow:0 0 10px 2px rgba(255,140,30,.3)}26%{box-shadow:0 0 26px 10px rgba(255,150,40,.65)}35%{box-shadow:0 0 8px 2px rgba(255,140,30,.25)}57%{box-shadow:0 0 28px 11px rgba(255,160,40,.7)}67%{box-shadow:0 0 12px 3px rgba(255,140,30,.35)}90%{box-shadow:0 0 22px 8px rgba(255,150,40,.6)}}
@keyframes sway{0%,100%{transform:scale(1) translateY(0)}30%{transform:scale(1.06,1.1) translateY(-3%)}55%{transform:scale(.96,1.02) translate(1.5%,-1%)}80%{transform:scale(1.04,1.07) translate(-1%,-2%)}}
.cell:focus-visible{outline:3px dashed var(--blood);outline-offset:-4px}
.cell.full{cursor:not-allowed}
.cell.full::after{background:radial-gradient(closest-side,rgba(40,30,20,.35),rgba(40,30,20,0))}
.cell .ring{position:absolute;left:18%;top:4%;width:64%;height:74%;overflow:visible;pointer-events:none}
.cell .ring path{fill:none;stroke:var(--blood);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw .9s cubic-bezier(.6,.05,.3,1) forwards}
.cell .who{position:absolute;left:4%;right:4%;bottom:5%;font-size:clamp(7px,.85vw,13px);color:var(--blood);
  text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;animation:fadeUp .5s .7s forwards}
.tag-full{position:absolute;right:6%;bottom:4%;font-size:clamp(8px,1vw,14px);color:var(--blood);transform:rotate(-8deg);pointer-events:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hint{position:absolute;left:0;right:0;top:92.4%;text-align:center;font-size:clamp(11px,1.5vw,21px);color:var(--ink);opacity:.78;pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}

/* ---------- booking card ---------- */
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,8,6,.25),rgba(11,8,6,.7));opacity:0;transition:opacity .3s;pointer-events:none}
.veil.on{opacity:1;pointer-events:auto}
.card{position:absolute;left:50%;top:52%;width:min(64%,560px);transform:translate(-50%,-46%) rotate(-1.2deg) scale(.92);opacity:0;
  pointer-events:none;transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .25s;color:var(--ink);
  padding:clamp(10px,2.2%,28px) clamp(12px,3%,34px) clamp(12px,2.6%,30px);font-size:clamp(8px,1.95cqw,20px)}
.card.on{opacity:1;transform:translate(-50%,-50%) rotate(-1.2deg) scale(1);pointer-events:auto}
.card::before{content:"";position:absolute;inset:0;background:var(--parch);border:3px solid var(--ink);border-radius:14px 22px 12px 26px/22px 12px 26px 14px;
  filter:url(#rough);box-shadow:8px 10px 0 rgba(11,8,6,.55);z-index:-1}
.card .close{position:absolute;top:6px;right:10px;background:none;border:0;font:inherit;font-size:1.6em;line-height:1;color:var(--ink);cursor:pointer;padding:4px 8px}
.card .close:focus-visible{outline:2px dashed var(--blood)}
.eyebrow{font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h2{font-family:var(--f-drip);font-weight:400;font-size:2.1em;line-height:1;margin:.1em 0 .35em;text-wrap:balance}
.card h2 em{font-style:normal;color:var(--blood)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em;margin:0 0 .8em}
.slot{font:inherit;font-size:.95em;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:10px 6px 12px 7px;
  padding:.28em 0;cursor:pointer;transition:background .15s,color .15s,transform .15s;font-variant-numeric:tabular-nums}
.slot:hover{background:var(--parch-deep);transform:rotate(-2deg)}
.slot:focus-visible{outline:2px dashed var(--blood);outline-offset:2px}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--parch);transform:rotate(-2deg)}
.slot:disabled{cursor:not-allowed;color:var(--muted);border-color:rgba(22,17,13,.3);text-decoration:line-through;text-decoration-color:var(--blood);text-decoration-thickness:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.5em .7em}
.fields label{display:flex;flex-direction:column;gap:.1em;font-size:.85em;color:var(--muted);min-width:0}
.fields input{font:inherit;font-size:1.15em;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:.1em 0;outline:none;min-width:0}
.fields input:focus{border-bottom-color:var(--blood)}
.fields input::placeholder{color:rgba(22,17,13,.35)}
.go{margin-top:.9em;width:100%;font-family:var(--f-drip);font-size:1.45em;letter-spacing:.02em;color:var(--parch);background:var(--ink);border:0;
  border-radius:16px 8px 18px 9px;padding:.32em 0 .38em;cursor:pointer;transition:transform .15s,background .2s}
.go:hover:not(:disabled){transform:rotate(-1deg) scale(1.02);background:#2a1a12}
.go:disabled{opacity:.35;cursor:not-allowed}
.go:focus-visible{outline:3px dashed var(--blood);outline-offset:3px}
.err{min-height:1.1em;margin:.35em 0 0;font-size:.85em;color:var(--blood)}
.fullnote{font-size:1.1em;margin:.2em 0 .4em}

/* ---------- toast + bat ---------- */
.toast{position:absolute;left:50%;bottom:1.5%;transform:translate(-50%,160%) rotate(1deg);padding:.45em 1.1em;color:var(--ink);font-size:clamp(9px,1.8cqw,21px);
  transition:transform .5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast::before{content:"";position:absolute;inset:0;background:var(--parch);border:2.5px solid var(--ink);border-radius:12px 18px 10px 20px;filter:url(#rough);box-shadow:5px 6px 0 rgba(11,8,6,.5);z-index:-1}
.toast.on{transform:translate(-50%,0) rotate(1deg)}
.toast b{color:var(--blood);font-weight:400}
.bat{position:absolute;width:9%;left:-12%;top:30%;pointer-events:none;z-index:4;opacity:0}
.bat.fly{animation:fly 1.9s cubic-bezier(.45,.1,.4,1) forwards}
.bat svg{width:100%;display:block;animation:flap .16s ease-in-out infinite alternate;transform-origin:50% 40%}
@keyframes fly{0%{opacity:1;left:-12%;top:58%}35%{top:30%}65%{top:44%}100%{opacity:1;left:108%;top:12%}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}

/* ---------- swinging necklaces ---------- */
/* Each charm sits exactly over its painted necklace. On hover, a dress-colored patch hides the painted one and the cut-out swings over it. */
.charm{position:absolute;z-index:1;cursor:default}
.charm img{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;user-select:none}
.charm.swing img{opacity:1}
.charm.swing .pend{animation:var(--swing) 2.6s ease-out forwards}
#charmFish{--swing:swingFish}
#charmFish .pend{transform-origin:53% 3%}
#charmBones{--swing:swingBones}
#charmBones .pend{transform-origin:44% 2%}
@keyframes swingFish{0%{transform:none}10%{transform:rotate(11deg)}26%{transform:rotate(-8deg)}42%{transform:rotate(5.5deg)}58%{transform:rotate(-3.5deg)}73%{transform:rotate(2deg)}87%{transform:rotate(-.8deg)}100%{transform:none}}
@keyframes swingBones{0%{transform:none}10%{transform:skewX(-6deg)}26%{transform:skewX(4.5deg)}42%{transform:skewX(-3deg)}58%{transform:skewX(2deg)}73%{transform:skewX(-1deg)}87%{transform:skewX(.4deg)}100%{transform:none}}

.under{display:flex;gap:18px;align-items:center;font-size:15px;color:#8d7b5c}
.under span{transition:opacity .4s}.under .gone{opacity:.45}
.under button{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dashed currentColor;cursor:pointer;padding:2px 0}
.under button:hover{color:var(--parch)}
.under button:focus-visible{outline:2px dashed var(--ember);outline-offset:3px}

@media (max-width:480px){
  .card{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    width:auto;transform:translateY(110%) rotate(0);font-size:16px;z-index:10}
  .card.on{transform:translateY(0) rotate(0)}
  .slots{grid-template-columns:repeat(4,1fr)}
  .fields{grid-template-columns:1fr}
  .veil{position:fixed;z-index:9}
}
@media (prefers-reduced-motion:reduce){
  .stage video{display:none}
  .cell .ring path{animation:none;stroke-dashoffset:0}
  .cell .who{animation:none;opacity:1}
  .bat{display:none}
  .charm{display:none}
  .cell:not(.full):hover,.cell:not(.full):hover::after{animation:none}
  .cell:not(.full):hover{box-shadow:0 0 18px 6px rgba(255,140,30,.5)}
  .hand{animation:none}
  .card,.toast{transition:opacity .2s}
}
</style>
<style>[hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<div class="rig">
<img class="hand" src="assets/hand-clean.png" alt="">
<main class="stage" id="stage" aria-label="October calendar. Choose a day to book an appointment.">
  <img class="poster" src="assets/poster.jpg" alt="">
  <video id="vid" src="assets/calendar-loop.mp4" poster="assets/poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
  <img class="hand hand-front" src="assets/hand-front.png" alt="">
  <div class="charm" id="charmFish" aria-hidden="true"><img class="cover" src="assets/necklace-fish-cover.png" alt=""><img class="pend" src="assets/necklace-fish.png" alt=""></div>
  <div class="charm" id="charmBones" aria-hidden="true"><img class="cover" src="assets/necklace-bones-cover.png" alt=""><img class="pend" src="assets/necklace-bones.png" alt=""></div>
  <div id="cells"></div>

  <div class="veil" id="veil"></div>
  <form class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle" novalidate>
    <button type="button" class="close" id="closeBtn" aria-label="Close">&times;</button>
    <div class="eyebrow" id="cardEyebrow">October 2026</div>
    <h2 id="cardTitle">Thursday <em>15</em></h2>
    <div id="bookable">
      <div class="slots" id="slots" role="group" aria-label="Available times"></div>
      <div class="fields">
        <label for="fName">your name<input id="fName" autocomplete="name" placeholder="Morticia A."></label>
        <label for="fEmail">email<input id="fEmail" type="email" autocomplete="email" placeholder="you@crypt.com" required></label>
      </div>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="go" id="goBtn" type="submit" disabled>Summon me</button>
    </div>
    <p class="fullnote" id="fullnote" hidden></p>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="bat" id="bat" aria-hidden="true"><svg viewBox="0 0 120 50"><path fill="#120c09" d="M60 14c-3 0-5-6-5-6l-2 7C42 12 30 2 0 6c14 6 20 14 20 26 6-6 14-7 20-2 2-6 10-8 15-2 2-3 3-6 5-6s3 3 5 6c5-6 13-4 15 2 6-5 14-4 20 2 0-12 6-20 20-26-30-4-42 6-53 9l-2-7s-2 6-5 6z"/></svg></div>
</main>
</div>

<div class="under">
  <span id="hint">tap a night to book a meeting</span>
  <button type="button" id="resetBtn">reset calendar</button>
  <button type="button" id="soundBtn" aria-pressed="false">sound: off</button>
</div>

<script>
(() => {
  // Grid measured from the artwork (1434 × 1080 frame).
  const W = 1434, H = 1080;
  const COLS = [94, 271, 448, 626, 803, 980, 1158, 1334];
  const ROWS = [542, 632, 722, 816, 903, 991];
  const YEAR = 2026, MONTH = 9;            // October 2026 starts on a Thursday, matching the drawing
  const FIRST = new Date(YEAR, MONTH, 1).getDay();
  const DAYS = 31;
  const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const TIMES = ["10:00","11:30","13:00","14:30","16:00","17:30","19:00","21:00"];
  const FULL = {7: "Covered in cobwebs. This one's fully booked.", 31: "Halloween night. Already taken by the ghouls."};

  // A few slots look taken so the calendar feels lived in.
  const taken = d => TIMES.filter((_, i) => ((d * 7 + i * 3) % 5) === 0 || (d === 13 && i < 5));

  const $ = id => document.getElementById(id);
  const cellsEl = $("cells"), card = $("card"), veil = $("veil"), slotsEl = $("slots"),
        nameEl = $("fName"), mailEl = $("fEmail"), goBtn = $("goBtn"), errEl = $("err"), hint = $("hint");

  let bookings = {};
  try { bookings = JSON.parse(localStorage.getItem("spooky-bookings") || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem("spooky-bookings", JSON.stringify(bookings)); } catch (e) {} };

  let current = null, chosen = null, lastCell = null;
  const pct = (v, t) => (v / t * 100) + "%";
  const pretty = t => { const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2,"0")} ${h < 12 ? "am" : "pm"}`; };
  const RING = '<svg class="ring" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" vector-effect="non-scaling-stroke" d="M80 17C70 5 30 4 15 15 3 25 9 48 40 53c32 5 55-6 50-25C87 18 76 10 58 9"/></svg>';

  function paintCell(btn, d) {
    btn.querySelectorAll(".ring,.who,.tag-full").forEach(n => n.remove());
    const b = bookings[d];
    if (b) {
      btn.insertAdjacentHTML("beforeend", RING + `<span class="who"></span>`);
      btn.querySelector(".who").textContent = `${b.name.split(" ")[0]} · ${pretty(b.time)}`;
      btn.setAttribute("aria-label", `${DOW[(FIRST + d - 1) % 7]} October ${d}, booked by ${b.name} at ${pretty(b.time)}`);
    } else if (FULL[d]) {
      if (d !== 31) btn.insertAdjacentHTML("beforeend", '<span class="tag-full" aria-hidden="true">full</span>');
      btn.setAttribute("aria-label", `October ${d}, fully booked`);
    } else {
      btn.setAttribute("aria-label", `${DOW[(FIRST + d - 1) % 7]} October ${d}, book a time`);
    }
  }

  for (let d = 1; d <= DAYS; d++) {
    const idx = FIRST + d - 1, c = idx % 7, r = Math.floor(idx / 7);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "cell" + (FULL[d] ? " full" : ""); btn.dataset.day = d;
    Object.assign(btn.style, { left: pct(COLS[c] + 3, W), top: pct(ROWS[r] + 3, H),
      width: pct(COLS[c + 1] - COLS[c] - 6, W), height: pct(ROWS[r + 1] - ROWS[r] - 6, H) });
    paintCell(btn, d);
    btn.addEventListener("click", () => openDay(d, btn));
    if (d === 31) btn.addEventListener("mouseenter", () => { if (!$("bat").classList.contains("fly")) flyBat(); });
    cellsEl.appendChild(btn);
  }

  function openDay(d, btn) {
    current = d; chosen = null; lastCell = btn;
    document.querySelectorAll(".cell.open").forEach(n => n.classList.remove("open"));
    btn.classList.add("open"); hint.classList.add("gone");
    $("cardEyebrow").textContent = "October 2026";
    $("cardTitle").innerHTML = `${DOW[(FIRST + d - 1) % 7]} <em>${d}</em>`;
    const full = FULL[d] && !bookings[d];
    $("bookable").hidden = !!full; $("fullnote").hidden = !full;
    if (full) { $("fullnote").textContent = FULL[d]; }
    else {
      const busy = taken(d), mine = bookings[d];
      slotsEl.innerHTML = "";
      TIMES.forEach(t => {
        const s = document.createElement("button");
        s.type = "button"; s.className = "slot"; s.textContent = pretty(t).replace(" ", "");
        s.disabled = busy.includes(t) && !(mine && mine.time === t);
        s.setAttribute("aria-pressed", "false");
        if (s.disabled) s.setAttribute("aria-label", pretty(t) + ", taken");
        s.addEventListener("click", () => { chosen = t; slotsEl.querySelectorAll(".slot").forEach(x => x.setAttribute("aria-pressed", x === s)); validate(); });
        if (mine && mine.time === t) { chosen = t; s.setAttribute("aria-pressed", "true"); }
        slotsEl.appendChild(s);
      });
      if (mine) { nameEl.value = mine.name; mailEl.value = mine.email; } else { nameEl.value = ""; mailEl.value = ""; }
      goBtn.textContent = mine ? "Move it" : "Summon me";
      errEl.textContent = ""; validate();
    }
    veil.classList.add("on"); card.classList.add("on");
    setTimeout(() => { (full ? $("closeBtn") : (slotsEl.querySelector(".slot:not(:disabled)") || nameEl)).focus({preventScroll:true}); }, 60);
  }

  function closeCard() {
    card.classList.remove("on"); veil.classList.remove("on");
    document.querySelectorAll(".cell.open").forEach(n => n.classList.remove("open"));
    if (lastCell) lastCell.focus({preventScroll:true});
  }

  const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  function validate() { goBtn.disabled = !(chosen && nameEl.value.trim() && emailOk(mailEl.value)); }
  nameEl.addEventListener("input", validate); mailEl.addEventListener("input", () => { errEl.textContent = ""; validate(); });
  mailEl.addEventListener("blur", () => { if (mailEl.value.trim() && !emailOk(mailEl.value)) errEl.textContent = "That email looks off. Check for a missing @ or dot."; });

  card.addEventListener("submit", e => {
    e.preventDefault();
    if (!chosen || !nameEl.value.trim()) return;
    if (!emailOk(mailEl.value)) { errEl.textContent = "That email looks off. Check for a missing @ or dot."; mailEl.focus(); return; }
    const d = current;
    bookings[d] = { time: chosen, name: nameEl.value.trim(), email: mailEl.value.trim() };
    save(); closeCard();
    const btn = cellsEl.querySelector(`[data-day="${d}"]`);
    setTimeout(() => paintCell(btn, d), 250);
    flyBat();
    window.spookySound?.play("scratch", 0.25);   // pen scratch as the red circle draws
    window.spookySound?.play("flutter");          // wings as the bat crosses
    toast(`Booked: <b>${DOW[(FIRST + d - 1) % 7].slice(0,3)} Oct ${d}, ${pretty(chosen)}</b>. See you then, ${escapeHtml(bookings[d].name.split(" ")[0])}.`);
    nameEl.value = ""; mailEl.value = ""; chosen = null;   // fresh form for the next booking
  });

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  let tt;
  function toast(html) { const t = $("toast"); t.innerHTML = html; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3600); }
  function flyBat() { const b = $("bat"); b.classList.remove("fly"); void b.offsetWidth; b.classList.add("fly"); }


  // Necklaces: boxes in artwork pixels (x, y, w, h) — must match the cut-out PNGs in assets/.
  [["charmFish", 140, 286, 75, 139], ["charmBones", 398, 284, 72, 148]].forEach(([id, x, y, w, h]) => {
    const el = $(id);
    Object.assign(el.style, { left: pct(x, W), top: pct(y, H), width: pct(w, W), height: pct(h, H) });
    el.addEventListener("pointerenter", () => { if (!el.classList.contains("swing")) { el.classList.add("swing"); window.spookySound?.play("rattle"); } });
    el.querySelector(".pend").addEventListener("animationend", () => el.classList.remove("swing"));
  });

  $("bat").addEventListener("animationend", e => { if (e.animationName === "fly") e.currentTarget.classList.remove("fly"); });

  $("closeBtn").addEventListener("click", closeCard);
  veil.addEventListener("click", closeCard);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && card.classList.contains("on")) closeCard(); });
  $("resetBtn").addEventListener("click", () => {
    bookings = {}; save(); nameEl.value = ""; mailEl.value = "";
    cellsEl.querySelectorAll(".cell").forEach(b => paintCell(b, +b.dataset.day));
    hint.classList.remove("gone"); closeCard();
  });

  // Hide the still once the video is actually playing.
  const vid = $("vid");
  vid.addEventListener("playing", () => { const p = document.querySelector(".poster"); if (p) p.style.visibility = "hidden"; });
})();
</script>
<script src="assets/sound.js"></script>
